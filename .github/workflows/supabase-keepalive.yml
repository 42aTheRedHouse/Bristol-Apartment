name: Keep Supabase awake

on:
  schedule:
    # Sunday and Wednesday - well within the 7-day free-tier pause window
    # even if a run is occasionally delayed or missed.
    - cron: "0 8 * * 0,3"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase to reset its inactivity timer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/supabase_keepalive.py
